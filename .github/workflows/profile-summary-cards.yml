name: Refresh animated profile signals

on:
  workflow_dispatch:
  schedule:
    - cron: '37 2 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile-summary-cards.yml'
      - 'scripts/generate-profile-snapshot.mjs'

concurrency:
  group: animated-profile-signals
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate animated public profile signals
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: hemkesh2021-dotcom
        run: node scripts/generate-profile-snapshot.mjs
      - name: Verify SVG animation output
        run: |
          for file in assets/profile-snapshot-{light,dark}.svg assets/profile-languages-{light,dark}.svg; do
            grep -q '<animate' "$file"
          done
      - name: Commit refreshed animated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-snapshot-{light,dark}.svg assets/profile-languages-{light,dark}.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh animated public profile signals"
          git push origin HEAD:main
