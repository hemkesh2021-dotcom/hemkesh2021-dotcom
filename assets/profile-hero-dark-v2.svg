<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Hemkesh — Software Engineer and AI/ML Engineer</title>
  <desc id="desc">Professional cyberpunk terminal banner with a boot sequence, animated data packets, subtle scan sweep, rotating HUD, and project status indicators.</desc>
  <style>
    .surface { fill: #030609; }
    .panel { fill: #080d12; }
    .grid { stroke: #79edf5; opacity: .09; }
    .city { fill: #20303b; opacity: .58; }
    .window { fill: #ff6b00; opacity: .58; }
    .primary { fill: #edf4f6; }
    .secondary { fill: #8fa2ab; }
    .cyan-fill { fill: #00e5ff; }
    .cyan-stroke { stroke: #00e5ff; }
    .orange-fill { fill: #ff6b00; }
    .orange-stroke { stroke: #ff6b00; }
    .terminal-stroke { stroke: #00e5ff; opacity: .22; }
    .status-surface { fill: #111820; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .display { font-family: Orbitron, ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>
  <defs>
    <linearGradient id="surfaceGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00e5ff" stop-opacity=".05"/>
      <stop offset="1" stop-color="#ff6b00" stop-opacity=".04"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#00e5ff" stop-opacity=".24"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="13" flood-color="#000000" flood-opacity=".24"/>
    </filter>
    <path id="routeA" d="M28 304 C230 246 355 333 520 260 S850 280 1168 125"/>
    <path id="routeB" d="M92 78 C300 142 455 50 620 124 S930 168 1170 298"/>
    <clipPath id="titleReveal" clipPathUnits="userSpaceOnUse">
      <rect x="68" y="158" width="245" height="62">
        <animate attributeName="width"
          values="0;0;35;70;105;140;175;210;245;245;0"
          keyTimes="0;.06;.085;.11;.135;.16;.185;.21;.235;.94;1"
          calcMode="discrete" dur="12s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <rect x="12" y="12" width="1176" height="352" rx="28" class="surface" filter="url(#softShadow)"/>
  <rect x="12" y="12" width="1176" height="352" rx="28" fill="url(#surfaceGlow)"/>
  <rect x="35" y="35" width="1130" height="306" rx="20" class="panel"/>
  <rect x="36" y="36" width="1128" height="304" rx="19" fill="none" class="cyan-stroke"
        stroke-width="1" stroke-dasharray="2 20" opacity=".16">
    <animate attributeName="stroke-dashoffset" from="0" to="-220" dur="18s" repeatCount="indefinite"/>
  </rect>

  <g class="grid" fill="none" stroke-width="1">
    <path d="M35 96H1165M35 157H1165M35 218H1165M35 279H1165"/>
    <path d="M148 35V341M261 35V341M374 35V341M487 35V341M600 35V341M713 35V341M826 35V341M939 35V341M1052 35V341"/>
  </g>

  <g class="city">
    <animateTransform attributeName="transform" type="translate"
      values="0 2;0 0;0 2" dur="18s" repeatCount="indefinite"/>
    <path d="M35 341v-71h42v-37h31v108h38v-72h54v72h35v-123h48v123h44v-65h30v65h63v-91h41v91h56v-142h51v142h48v-96h69v96h28v-121h65v121h40v-69h49v69h33v-108h51v108h45v-61h53v61h38v-136h57v136z"/>
    <g class="window">
      <rect x="243" y="239" width="6" height="11"><animate attributeName="opacity" values=".18;.9;.28" dur="3.7s" begin="-1.2s" repeatCount="indefinite"/></rect>
      <rect x="262" y="239" width="6" height="11"><animate attributeName="opacity" values=".72;.2;.84" dur="4.9s" begin="-2.8s" repeatCount="indefinite"/></rect>
      <rect x="507" y="224" width="7" height="12"><animate attributeName="opacity" values=".22;.86;.32" dur="4.2s" begin="-.7s" repeatCount="indefinite"/></rect>
      <rect x="527" y="224" width="7" height="12"><animate attributeName="opacity" values=".8;.24;.72" dur="5.4s" begin="-3.1s" repeatCount="indefinite"/></rect>
      <rect x="750" y="244" width="7" height="12"><animate attributeName="opacity" values=".16;.92;.26" dur="3.9s" begin="-2s" repeatCount="indefinite"/></rect>
      <rect x="772" y="244" width="7" height="12"><animate attributeName="opacity" values=".76;.18;.88" dur="5.1s" begin="-.4s" repeatCount="indefinite"/></rect>
      <rect x="1031" y="220" width="7" height="12"><animate attributeName="opacity" values=".2;.82;.3" dur="4.6s" begin="-3.6s" repeatCount="indefinite"/></rect>
      <rect x="1053" y="220" width="7" height="12"><animate attributeName="opacity" values=".84;.22;.74" dur="5.7s" begin="-1.5s" repeatCount="indefinite"/></rect>
    </g>
  </g>

  <g fill="none" stroke-width="1.4" class="terminal-stroke">
    <use href="#routeA"/><use href="#routeB"/>
  </g>
  <g filter="url(#softGlow)">
    <circle r="4" class="cyan-fill"><animateMotion dur="7s" repeatCount="indefinite"><mpath href="#routeA"/></animateMotion></circle>
    <circle r="3.5" class="orange-fill"><animateMotion dur="10s" begin="-4s" repeatCount="indefinite"><mpath href="#routeB"/></animateMotion></circle>
    <circle r="3" class="cyan-fill"><animateMotion dur="12s" begin="-8s" repeatCount="indefinite"><mpath href="#routeA"/></animateMotion></circle>
    <circle r="2.6" class="orange-fill" opacity=".72"><animateMotion dur="8.5s" begin="-6s" repeatCount="indefinite"><mpath href="#routeB"/></animateMotion></circle>
    <circle r="2.4" class="cyan-fill" opacity=".64"><animateMotion dur="11s" begin="-2.5s" repeatCount="indefinite"><mpath href="#routeA"/></animateMotion></circle>
  </g>

  <g transform="translate(1033 109)" fill="none" class="cyan-stroke" opacity=".58">
    <circle r="49" stroke-width="1" stroke-dasharray="8 12">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="24s" repeatCount="indefinite"/>
    </circle>
    <circle r="33" stroke-width="1.5" stroke-dasharray="3 8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="16s" repeatCount="indefinite"/>
    </circle>
    <path d="M-58 0H-40M40 0H58M0-58V-40M0 40V58"/>
    <path d="M0 0V-42" stroke-width="1.2" opacity=".42">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
    </path>
    <circle r="5" class="orange-fill" stroke="none"><animate attributeName="opacity" values=".25;.9;.25" dur="2.8s" repeatCount="indefinite"/></circle>
  </g>

  <rect x="35" y="35" width="1130" height="3" fill="url(#scan)" opacity="0">
    <animate attributeName="y" values="35;338;35" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;.8;0" dur="9s" repeatCount="indefinite"/>
  </rect>

  <g class="mono">
    <text x="69" y="70" class="cyan-fill" font-size="14" letter-spacing="1.5">
      PROFILE_SYSTEM / BOOT
      <animate attributeName="opacity" values=".62;1;.62" dur="3s" repeatCount="indefinite"/>
    </text>
    <rect x="69" y="78" width="180" height="2" rx="1" class="status-surface"/>
    <rect x="69" y="78" width="180" height="2" rx="1" class="cyan-fill" opacity=".62">
      <animate attributeName="width" values="0;0;180;180;0" keyTimes="0;.02;.16;.9;1" dur="12s" repeatCount="indefinite"/>
    </rect>
    <text x="69" y="98" class="secondary" font-size="13">
      &gt; identity verified: hemkesh2021-dotcom
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.02;.07;.84;.9;1" dur="12s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 4;0 4;0 0;0 0;0 4;0 4" keyTimes="0;.02;.07;.84;.9;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="69" y="120" class="secondary" font-size="13">
      &gt; loading: software · intelligence · systems
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.05;.1;.86;.92;1" dur="12s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 4;0 4;0 0;0 0;0 4;0 4" keyTimes="0;.05;.1;.86;.92;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="69" y="142" class="secondary" font-size="13">
      &gt; status: ready to build
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.08;.13;.88;.94;1" dur="12s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 4;0 4;0 0;0 0;0 4;0 4" keyTimes="0;.08;.13;.88;.94;1" dur="12s" repeatCount="indefinite"/>
    </text>
  </g>

  <g class="display">
    <g clip-path="url(#titleReveal)">
      <text x="68" y="206" class="primary" font-size="48" font-weight="600" letter-spacing="3">HEMKESH</text>
      <text x="68" y="206" class="orange-fill" opacity="0" font-size="48" font-weight="600" letter-spacing="3">
        HEMKESH
        <animate attributeName="opacity"
          values="0;0;.5;.14;0;0" keyTimes="0;.79;.81;.83;.85;1"
          dur="12s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate"
          values="0 0;0 0;3 -1;-2 1;0 0;0 0"
          keyTimes="0;.79;.81;.83;.85;1" dur="12s" repeatCount="indefinite"/>
      </text>
    </g>
    <rect x="310" y="167" width="4" height="45" class="orange-fill">
      <animate attributeName="x"
        values="68;68;103;138;173;208;243;278;310;310;68"
        keyTimes="0;.06;.085;.11;.135;.16;.185;.21;.235;.94;1"
        calcMode="discrete" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1" dur=".82s" repeatCount="indefinite"/>
    </rect>
    <text x="70" y="239" class="secondary" font-size="17" letter-spacing="1.1">
      SOFTWARE ENGINEER × AI/ML ENGINEER
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.25;.3;.94;1" dur="12s" repeatCount="indefinite"/>
    </text>
  </g>

  <g class="mono">
    <rect x="69" y="258" width="178" height="31" rx="15.5" class="status-surface"/>
    <circle cx="86" cy="273.5" r="4" class="cyan-fill">
      <animate attributeName="r" values="3.4;5;3.4" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".52;1;.52" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="99" y="278" class="primary" font-size="11" letter-spacing=".7">STUDENT · 2027</text>
    <rect x="258" y="258" width="218" height="31" rx="15.5" class="status-surface"/>
    <circle cx="275" cy="273.5" r="4" class="orange-fill">
      <animate attributeName="r" values="3.2;4.8;3.2" dur="2.8s" begin="-.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".48;1;.48" dur="2.8s" begin="-.9s" repeatCount="indefinite"/>
    </circle>
    <text x="288" y="278" class="primary" font-size="11" letter-spacing=".7">OPEN TO FULL-TIME</text>
  </g>

  <g class="mono" transform="translate(703 198)">
    <text x="0" y="0" class="secondary" font-size="11" letter-spacing="1.1">FEATURED SYSTEMS</text>
    <g transform="translate(0 18)">
      <rect width="397" height="30" rx="9" class="status-surface"/>
      <rect x="0" y="28" width="0" height="1.5" class="cyan-fill" opacity=".5">
        <animate attributeName="width" values="0;397;397;0" keyTimes="0;.28;.72;1" dur="8s" repeatCount="indefinite"/>
      </rect>
      <text x="13" y="20" class="primary" font-size="11">AEGIS</text>
      <text x="112" y="20" class="cyan-fill" font-size="11">COMPLETED</text>
      <text x="382" y="20" text-anchor="end" class="secondary" font-size="11">AGENTIC RAG</text>
    </g>
    <g transform="translate(0 56)">
      <rect width="397" height="30" rx="9" class="status-surface"/>
      <rect x="0" y="28" width="0" height="1.5" class="orange-fill" opacity=".44">
        <animate attributeName="width" values="0;397;397;0" keyTimes="0;.28;.72;1" dur="9s" begin="-3s" repeatCount="indefinite"/>
      </rect>
      <text x="13" y="20" class="primary" font-size="11">SENTINEL</text>
      <text x="112" y="20" class="orange-fill" font-size="11">PROTOTYPE COMPLETE</text>
      <text x="382" y="20" text-anchor="end" class="secondary" font-size="11">IMPROVING</text>
    </g>
    <g transform="translate(0 94)">
      <rect width="397" height="30" rx="9" class="status-surface"/>
      <rect x="0" y="28" width="0" height="1.5" class="orange-fill" opacity=".38">
        <animate attributeName="width" values="0;397;397;0" keyTimes="0;.28;.72;1" dur="10s" begin="-6s" repeatCount="indefinite"/>
      </rect>
      <text x="13" y="20" class="primary" font-size="11">ARIA</text>
      <text x="112" y="20" class="orange-fill" font-size="11">ACTIVE BUILD</text>
      <text x="382" y="20" text-anchor="end" class="secondary" font-size="11">LOCAL-FIRST AI</text>
    </g>
  </g>
</svg>
