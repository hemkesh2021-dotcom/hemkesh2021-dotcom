<text x="54" y="89" fill="#1D1B18" font-family="Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="720">Detects, identifies, understands, and alerts locally on NVIDIA Jetson.</text><text x="54" y="116" fill="#6E675E" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="600">RTSP camera → tracking → face recognition → local VLM → dashboard + alerts</text><rect x="30" y="170" width="556" height="82" rx="16" fill="#FBF7EF" stroke="#C9BBA7"/>
<circle cx="52" cy="197" r="4.5" fill="#C86432"><animate attributeName="opacity" values=".35;1;.35" dur="2.10s" repeatCount="indefinite"/></circle>
<text x="69" y="202" fill="#1D1B18" font-family="Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" font-weight="700">Completed working prototype</text><text x="69" y="226" fill="#6E675E" font-family="Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" font-weight="500">with local inference end to end</text><rect x="614" y="170" width="556" height="82" rx="16" fill="#FBF7EF" stroke="#C9BBA7"/>
<circle cx="636" cy="197" r="4.5" fill="#C86432"><animate attributeName="opacity" values=".35;1;.35" dur="2.23s" repeatCount="indefinite"/></circle>
<text x="653" y="202" fill="#1D1B18" font-family="Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" font-weight="700">Improvement work remains active</text><text x="653" y="226" fill="#6E675E" font-family="Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" font-weight="500">across reliability, security, and UX</text><rect x="30" y="271" width="1140" height="85" rx="18" fill="#DED3C2" stroke="#C9BBA7"/>
<text x="52" y="301" fill="#1D1B18" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="760">STACK · Python · YOLOv8n TensorRT · ByteTrack · DeepFace · LFM2-VL 1.6B</text><text x="52" y="325" fill="#6E675E" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="600">RUNTIME · llama.cpp · Flask · NVIDIA Jetson · ONVIF / RTSP</text>
