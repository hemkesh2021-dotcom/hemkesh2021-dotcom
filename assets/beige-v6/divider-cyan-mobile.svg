<svg xmlns="http://www.w3.org/2000/svg" width="680" height="66" viewBox="0 0 680 66" role="img" aria-labelledby="title-divider-cyan-m-v6">
<title id="title-divider-cyan-m-v6">Animated section boundary</title>
<defs>
  <linearGradient id="scan-divider-cyan-m-v6" x1="0" x2="1"><stop stop-color="#008EA3" stop-opacity="0"/><stop offset=".5" stop-color="#008EA3" stop-opacity=".16"/><stop offset="1" stop-color="#008EA3" stop-opacity="0"/></linearGradient>
  <linearGradient id="scan-orange-divider-cyan-m-v6" x1="0" x2="1"><stop stop-color="#C86432" stop-opacity="0"/><stop offset=".5" stop-color="#C86432" stop-opacity=".28"/><stop offset="1" stop-color="#C86432" stop-opacity="0"/></linearGradient>
  <filter id="shadow-divider-cyan-m-v6" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#594E40" flood-opacity=".18"/></filter>
  <filter id="soft-divider-cyan-m-v6" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#594E40" flood-opacity=".13"/></filter>
</defs>
<rect width="680" height="66" rx="20" fill="#28231D"/>
<rect x="-163" y="5" width="163" height="56" rx="14" fill="url(#scan-divider-cyan-m-v6)"><animate attributeName="x" from="-163" to="680" dur="4.8s" repeatCount="indefinite"/></rect>
<rect x="680" y="5" width="122" height="56" rx="14" fill="url(#scan-orange-divider-cyan-m-v6)"><animate attributeName="x" from="680" to="-122" dur="6.1s" repeatCount="indefinite"/></rect>
<path d="M30 29H650" stroke="#008EA3" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="18 13" opacity=".92"><animate attributeName="stroke-dashoffset" from="0" to="-186" dur="3.6s" repeatCount="indefinite"/></path>
<path d="M30 39H650" stroke="#C86432" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 22" opacity=".72"><animate attributeName="stroke-dashoffset" from="0" to="168" dur="4.4s" repeatCount="indefinite"/></path>
<circle r="5.5" fill="#008EA3" filter="url(#soft-divider-cyan-m-v6)"><animateMotion path="M34 29H646" dur="4.2s" repeatCount="indefinite"/><animate attributeName="r" values="4;7;4" dur="1.4s" repeatCount="indefinite"/></circle>
<circle r="4" fill="#C86432"><animateMotion path="M646 39H34" dur="5.2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".35;1;.35" dur="1.2s" repeatCount="indefinite"/></circle>
<path d="M18 21V47M662 21V47" stroke="#008EA3" stroke-width="3" opacity=".85"><animate attributeName="opacity" values=".35;1;.35" dur="1.1s" repeatCount="indefinite"/></path>
</svg>