<circle cx="52" cy="389" r="4.5" fill="#008EA3"><animate attributeName="opacity" values=".35;1;.35" dur="2.62s" repeatCount="indefinite"/></circle>
<text x="69" y="394" fill="#1D1B18" font-family="Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" font-weight="700">PII redaction, OIDC roles, maker-checker</text><text x="69" y="418" fill="#6E675E" font-family="Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" font-weight="500">approval, rate limits, and append-only audit</text><rect x="614" y="362" width="556" height="82" rx="16" fill="#FBF7EF" stroke="#C9BBA7"/>
<circle cx="636" cy="389" r="4.5" fill="#008EA3"><animate attributeName="opacity" values=".35;1;.35" dur="2.75s" repeatCount="indefinite"/></circle>
