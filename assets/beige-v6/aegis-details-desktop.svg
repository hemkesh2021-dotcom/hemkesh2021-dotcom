<text x="54" y="89" fill="#1D1B18" font-family="Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="720">Verifies AI-generated banking complaint responses before customer delivery.</text><text x="54" y="116" fill="#6E675E" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="600">ingest → classify → compliance → retrieve → draft → verify → audit</text><rect x="30" y="170" width="556" height="82" rx="16" fill="#FBF7EF" stroke="#C9BBA7"/>
