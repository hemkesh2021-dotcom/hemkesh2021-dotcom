<circle cx="52" cy="293" r="4.5" fill="#008EA3"><animate attributeName="opacity" values=".35;1;.35" dur="2.36s" repeatCount="indefinite"/></circle>
<text x="69" y="298" fill="#1D1B18" font-family="Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" font-weight="700">NVIDIA NIM drafting with deterministic</text><text x="69" y="322" fill="#6E675E" font-family="Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" font-weight="500">template-engine fallback</text><rect x="614" y="266" width="556" height="82" rx="16" fill="#FBF7EF" stroke="#C9BBA7"/>
<circle cx="636" cy="293" r="4.5" fill="#C86432"><animate attributeName="opacity" values=".35;1;.35" dur="2.49s" repeatCount="indefinite"/></circle>
