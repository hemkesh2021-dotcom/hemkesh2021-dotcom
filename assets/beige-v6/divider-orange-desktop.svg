<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="54" viewBox="0 0 1200 54" role="img" aria-labelledby="title-divider-orange-d-v6">
<title id="title-divider-orange-d-v6">Animated section boundary</title>
<defs>
  <linearGradient id="scan-divider-orange-d-v6" x1="0" x2="1"><stop stop-color="#008EA3" stop-opacity="0"/><stop offset=".5" stop-color="#008EA3" stop-opacity=".16"/><stop offset="1" stop-color="#008EA3" stop-opacity="0"/></linearGradient>
  <linearGradient id="scan-orange-divider-orange-d-v6" x1="0" x2="1"><stop stop-color="#C86432" stop-opacity="0"/><stop offset=".5" stop-color="#C86432" stop-opacity=".28"/><stop offset="1" stop-color="#C86432" stop-opacity="0"/></linearGradient>
  <filter id="shadow-divider-orange-d-v6" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#594E40" flood-opacity=".18"/></filter>
  <filter id="soft-divider-orange-d-v6" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#594E40" flood-opacity=".13"/></filter>
</defs>
<rect width="1200" height="54" rx="18" fill="#28231D"/>
<rect x="-288" y="5" width="288" height="44" rx="14" fill="url(#scan-divider-orange-d-v6)"><animate attributeName="x" from="-288" to="1200" dur="4.8s" repeatCount="indefinite"/></rect>
<rect x="1200" y="5" width="216" height="44" rx="14" fill="url(#scan-orange-divider-orange-d-v6)"><animate attributeName="x" from="1200" to="-216" dur="6.1s" repeatCount="indefinite"/></rect>
<path d="M30 23H1170" stroke="#C86432" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="18 13" opacity=".92"><animate attributeName="stroke-dashoffset" from="0" to="-186" dur="3.6s" repeatCount="indefinite"/></path>
<path d="M30 33H1170" stroke="#008EA3" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 22" opacity=".72"><animate attributeName="stroke-dashoffset" from="0" to="168" dur="4.4s" repeatCount="indefinite"/></path>
<circle r="5.5" fill="#C86432" filter="url(#soft-divider-orange-d-v6)"><animateMotion path="M34 23H1166" dur="4.2s" repeatCount="indefinite"/><animate attributeName="r" values="4;7;4" dur="1.4s" repeatCount="indefinite"/></circle>
<circle r="4" fill="#008EA3"><animateMotion path="M1166 33H34" dur="5.2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".35;1;.35" dur="1.2s" repeatCount="indefinite"/></circle>
<path d="M18 15V41M1182 15V41" stroke="#C86432" stroke-width="3" opacity=".85"><animate attributeName="opacity" values=".35;1;.35" dur="1.1s" repeatCount="indefinite"/></path>
</svg>