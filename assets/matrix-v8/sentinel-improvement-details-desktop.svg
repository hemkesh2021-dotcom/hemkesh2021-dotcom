iability, and</text><text x="567" y="173.9" fill="#14161A" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5">long-running observability</text><rect x="28" y="209" width="463" height="79.2" rx="16" fill="#EDEFF3" filter="url(#neu-sentinel-improvement-details-d)"/><rect x="28.75" y="209.75" width="461.5" height="77.7" rx="16" fill="none" stroke="url(#edge-sentinel-improvement-details-d)" stroke-width="1.5"/><rect x="46" y="234.6" width="28" height="28" rx="9" fill="#DCE0E6"/><rect x="46" y="234.6" width="28" height="28" rx="9" fill="url(#inset-sentinel-improvement-details-d)"/><rect x="46.5" y="235.1" width="27" height="27" rx="9" fill="none" stroke="#CBD1D9" stroke-opacity=".8"/><text x="60" y="252.52" fill="#14161A" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10" font-weight="700" text-anchor="middle">03</text><text x="86" y="243.2" fill="#14161A" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5">Harden authentication, transport security,</text><text x="86" y="264.8" fill="#14161A" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5">secrets handling, and deployment defaults</text><rect x="509" y="209" width="463" height="79.2" rx="16" fill="#EDEFF3" filter="url(#neu-sentinel-improvement-details-d)"/><rect x="509.75" y="209.75" width="461.5" height="77.7" rx="16" fill="none" stroke="url(#edge-sentinel-improvement-details-d)" stroke-width="1.5"/><rect x="527" y="234.6" width="28" height="28" rx="9" fill="#DCE0E6"/><rect x="527" y="234.6" width="28" height="28" rx="9" fill="url(#inset-sentinel-improvement-details-d)"/><rect x="527.5" y="235.1" width="27" height="27" rx="9" fill="none" stroke="#CBD1D9" stroke-opacity=".8"/><text x="541" y="252.52" fill="#14161A" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10" font-we