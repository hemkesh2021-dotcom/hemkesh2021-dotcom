<rect x="24" y="136.16" width="392" height="107.1" rx="17" fill="#EDEFF3" filter="url(#neu-build-m)"/><rect x="24.75" y="136.91" width="390.5" height="105.6" rx="17" fill="none" stroke="url(#edge-build-m)" stroke-width="1.5"/><circle cx="43.32" cy="156.49" r="2.52" fill="#14161A"/><text x="52.56" y="160.02" fill="#14161A" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="8.82" font-weight="700" letter-spacing="1.5">$ genai</text><text x="40.8" y="187.53" fill="#14161A" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.28" font-weight="600" letter-spacing="-0.2">Generative AI systems</text><text x="40.8" y="210.37" fill="#454B54" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.34">Agent workflows, hybrid retrieval, grounded</text><text x="40.8" y="227.95" fill="#454B54" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.34">generation, evaluation, and human approval paths.</text><rect x="24" y="251.26" width="392" height="124.68" rx="17" fill="#EDEFF3" filter="url(#neu-build-m)"/><rect x="24.75" y="252.01" width="390.5" height="123.18" rx="17" fill="none" stroke="url(#edge-build-m)" stroke-width="1.5"/><circle cx="43.32" cy="271.59" r="2.52" fill="#14161A"/><text x="52.56" y="275.12" fill="#14161A" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="8.82" font-weight="700" letter-spacing="1.5">$ edge</text><text x="40.8" y="302.63" fill="#14161A" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.28" font-weight="600" letter-spacing="-0.2">Edge intelligence</text><text x="40.8" y="325.47" fill="#454B54" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.34">TensorRT computer vision, local multimodal models,</text><text x="40.8" y="343.05" fill="#454B54" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.34">constrained-memory deployment, and real-time</text><text x="40.8" y="360.63" fill="#454B54" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.34">inference.</text><rect x="24" y="383.94" width="392" height="124.68" rx="17" fill="#EDEFF3" filter="url(#neu-build-m)"/><rect x="24.75" y="384.69" width="390.5" height="123.18" rx="17" fill="none" stroke="url(#edge-build-m)" stroke-width="1.5"/><circle cx="43.32" cy="404.27" r="2.52" fill="#14161A"/><text x="52.56" y="407.79" fill="#14161A" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="8.82" font-weight="700" letter-spacing="1.5">$ systems</text><text x="40.8" y="435.3" fill="#14161A" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.28" font-weight="600" letter-spacing="-0.2">Production-oriented software</text><text x="40.8" y="458.15" fill="#454B54" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.34">Java and Python services, full-stack interfaces,</text><text x="40.8" y="475.73" fill="#454B54" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.34">PostgreSQL, containers, security, and</text><text x="40.8" y="493.31" fill="#454B54" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.34">observability.</text>
