e><text x="796.32" y="84.14" fill="#14161A" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="700" letter-spacing="0.7">3 PRACTICE AREAS</text>
<rect x="28" y="150" width="302.67" height="169.35" rx="20" fill="#EDEFF3" filter="url(#neu-build-d)"/><rect x="28.75" y="150.75" width="301.17" height="167.85" rx="20" fill="none" stroke="url(#edge-build-d)" stroke-width="1.5"/><circle cx="51" cy="174.2" r="3" fill="#14161A"/><text x="62" y="178.4" fill="#14161A" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" font-weight="700" letter-spacing="1.5">$ genai</text><text x="48" y="211.15" fill="#14161A" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" letter-spacing="-0.2">Generative AI systems</text><text x="48" y="238.35" fill="#454B54" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5">Agent workflows, hybrid</text><text x="48" y="259.28" fill="#454B54" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5">retrieval, grounded generation,</text><text x="48" y="280.2" fill="#454B54" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5">evaluation, and human approval</text><text x="48" y="301.13" fill="#454B54" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5">paths.</text><rect x="348.67" y="150" width="302.67" height="169.35" rx="20" fill="#EDEFF3" filter="url(#neu-build-d)"/><rect x="349.42" y="150.75" width="301.17" height="167.85" rx="20" fill="none" stroke="url(#edge-build-d)" stroke-width="1.5"/><circle cx="371.67" cy="174.2" r="3" fill="#14161A"/><text x="382.67" y="178.4" fill="#14161A" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" font-weight="700" letter-spacing="1.5">$ edge</text><text x="368.67" y="211.15" fill="#14161A" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" letter-spacing="-0.2">Edge intelligence</text><text x="368.67" y="238.35" fill="#454B54" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5">TensorRT computer vision, local</text><text x="368.67" y="259.28" fill="#454B54" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5">multimodal models,</text><text x="368.67" y="280.2" fill="#454B54" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5">constrained-memory deployment,</text><text x="368.67" y="301.13" fill="#454B54" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5">and real-time inference.</text><rect x="669.33" y="150" width="302.67" height="169.35" rx="20" fill="#EDEFF3" filter="url(#neu-build-d)"/><rect x="670.08" y="150.75" width="301.17" height="167.85" rx="20" fill="none" stroke="url(#edge-build-d)" stroke-width="1.5"/><circle cx="692.33" cy="174.2" r="3" fill="#14161A"/><text x="703.33" y="178.4" fill="#14161A" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" font-weight="700" letter-spacing="1.5">$ systems</text><text x="689.33" y="211.15" fill="#14161A" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" letter-spacing="-0.2">Production-oriented software</text><text x="689.33" y="238.35" fill="#454B54" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5">Java and Python services,</text><text x="689.33" y="259.28" fill="#454B54" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5">full-stack interfaces,</text><text x="689.33" y="280.2" fill="#454B54" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5">PostgreSQL, containers,</text><text x="689.33" y="301.13" fill="#454B54" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5">security, and observability.</text>
