te attributeName="stroke-opacity" values=".5;0" dur="2.4s" repeatCount="indefinite"/></circle><text x="588.19" y="78.77" fill="#14161A" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10.81" font-weight="700" letter-spacing="0.7">3 PRACTICE AREAS</text>
<rect x="26" y="137.76" width="357" height="139.52" rx="19" fill="#EDEFF3" filter="url(#neu-build-t)"/><rect x="26.75" y="138.51" width="355.5" height="138.02" rx="19" fill="none" stroke="url(#edge-build-t)" stroke-width="1.5"/><circle cx="47.62" cy="160.51" r="2.82" fill="#14161A"/><text x="57.96" y="164.46" fill="#14161A" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="9.87" font-weight="700" letter-spacing="1.5">$ genai</text><text x="44.8" y="195.24" fill="#14161A" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.98" font-weight="600" letter-spacing="-0.2">Generative AI systems</text><text x="44.8" y="220.81" fill="#454B54" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.69">Agent workflows, hybrid retrieval,</text><text x="44.8" y="240.48" fill="#454B54" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.69">grounded generation, evaluation, and</text><text x="44.8" y="260.15" fill="#454B54" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.69">human approval paths.</text><rect x="397" y="137.76" width="357" height="139.52" rx="19" fill="#EDEFF3" filter="url(#neu-build-t)"/><rect x="397.75" y="138.51" width="355.5" height="138.02" rx="19" fill="none" stroke="url(#edge-build-t)" stroke-width="1.5"/><circle cx="418.62" cy="160.51" r="2.82" fill="#14161A"/><text x="428.96" y="164.46" fill="#14161A" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="9.87" font-weight="700" letter-spacing="1.5">$ edge</text><text x="415.8" y="195.24" fill="#14161A" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.98" font-weight="600" letter-spacing="-0.2">Edge intelligence</text><text x="415.8" y="220.81" fill="#454B54" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.69">TensorRT computer vision, local</text><text x="415.8" y="240.48" fill="#454B54" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.69">multimodal models, constrained-memory</text><text x="415.8" y="260.15" fill="#454B54" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.69">deployment, and real-time inference.</text><rect x="26" y="291.28" width="357" height="139.52" rx="19" fill="#EDEFF3" filter="url(#neu-build-t)"/><rect x="26.75" y="292.03" width="355.5" height="138.02" rx="19" fill="none" stroke="url(#edge-build-t)" stroke-width="1.5"/><circle cx="47.62" cy="314.03" r="2.82" fill="#14161A"/><text x="57.96" y="317.98" fill="#14161A" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="9.87" font-weight="700" letter-spacing="1.5">$ systems</text><text x="44.8" y="348.76" fill="#14161A" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.98" font-weight="600" letter-spacing="-0.2">Production-oriented software</text><text x="44.8" y="374.33" fill="#454B54" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.69">Java and Python services, full-stack</text><text x="44.8" y="394" fill="#454B54" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.69">interfaces, PostgreSQL, containers,</text><text x="44.8" y="413.67" fill="#454B54" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.69">security, and observability.</text>
