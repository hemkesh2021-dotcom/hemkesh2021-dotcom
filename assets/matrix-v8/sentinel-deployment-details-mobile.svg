<rect x="24" y="110.2" width="392" height="66.53" rx="13" fill="#EDEFF3" filter="url(#neu-sentinel-deployment-details-m)"/><rect x="24.75" y="110.95" width="390.5" height="65.03" rx="13" fill="none" stroke="url(#edge-sentinel-deployment-details-m)" stroke-width="1.5"/><rect x="39.12" y="131.71" width="23.52" height="23.52" rx="8" fill="#DCE0E6"/><rect x="39.12" y="131.71" width="23.52" height="23.52" rx="8" fill="url(#inset-sentinel-deployment-details-m)"/><rect x="39.62" y="132.21" width="22.52" height="22.52" rx="8" fill="none" stroke="#CBD1D9" stroke-opacity=".8"/><text x="50.88" y="146.76" fill="#14161A" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="8.4" font-weight="700" text-anchor="middle">01</text><text x="72.72" y="138.93" fill="#14161A" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.34">Unified-memory mode lets the VLM use Jetson's</text><text x="72.72" y="157.08" fill="#14161A" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.34">shared CPU / GPU memory pool</text><rect x="24" y="181.93" width="392" height="66.53" rx="13" fill="#EDEFF3" filter="url(#neu-sentinel-deployment-details-m)"/><rect x="24.75" y="182.68" width="390.5" height="65.03" rx="13" fill="none" stroke="url(#edge-sentinel-deployment-details-m)" stroke-width="1.5"/><rect x="39.12" y="203.44" width="23.52" height="23.52" rx="8" fill="#DCE0E6"/><rect x="39.12" y="203.44" width="23.52" height="23.52" rx="8" fill="url(#inset-sentinel-deployment-details-m)"/><rect x="39.62" y="203.94" width="22.52" height="22.52" rx="8" fill="none" stroke="#CBD1D9" stroke-opacity=".8"/><text x="50.88" y="218.49" fill="#14161A" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="8.4" font-weight="700" text-anchor="middle">02</text><text x="72.72" y="210.66" fill="#14161A" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.34">Headless startup launches the VLM first, then</text><text x="72.72" y="228.8" fill="#14161A" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.34">surveillance and dashboard services</text><rect x="24" y="253.66" width="392" height="66.53" rx="13" fill="#EDEFF3" filter="url(#neu-sentinel-deployment-details-m)"/><rect x="24.75" y="254.41" width="390.5" height="65.03" rx="13" fill="none" stroke="url(#edge-sentinel-deployment-details-m)" stroke-width="1.5"/><rect x="39.12" y="275.16" width="23.52" height="23.52" rx="8" fill="#DCE0E6"/><rect x="39.12" y="275.16" width="23.52" height="23.52" rx="8" fill="url(#inset-sentinel-deployment-details-m)"/><rect x="39.62" y="275.66" width="22.52" height="22.52" rx="8" fill="none" stroke="#CBD1D9" stroke-opacity=".8"/><text x="50.88" y="290.22" fill="#14161A" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="8.4" font-weight="700" text-anchor="middle">03</text><text x="72.72" y="282.39" fill="#14161A" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.34">llama-server, Python inference, and Flask run</text><text x="72.72" y="300.53" fill="#14161A" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.34">as isolated processes</text><rect x="24" y="325.39" width="392" height="66.53" rx="13" fill="#EDEFF3" filter="url(#neu-sentinel-deployment-details-m)"/><rect x="24.75" y="326.14" width="390.5" height="65.03" rx="13" fill="none" stroke="url(#edge-sentinel-deployment-details-m)" stroke-width="1.5"/><rect x="39.12" y="346.89" width="23.52" height="23.52" rx="8" fill="#DCE0E6"/><rect x="39.12" y="346.89" width="23.52" height="23.52" rx="8" fill="url(#inset-sentinel-deployment-details-m)"/><rect x="39.62" y="347.39" width="22.52" height="22.52" rx="8" fill="none" stroke="#CBD1D9" stroke-opacity=".8"/><text x="50.88" y="361.94" fill="#14161A" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="8.4" font-weight="700" text-anchor="middle">04</text><text x="72.72" y="354.12" fill="#14161A" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.34">Frames and state are exchanged atomically to</text><text x="72.72" y="372.26" fill="#14161A" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.34">prevent torn dashboard reads</text>
