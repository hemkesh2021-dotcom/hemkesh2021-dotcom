<rect x="26" y="107.77" width="357" height="94.75" rx="15" fill="#EDEFF3" filter="url(#neu-sentinel-deployment-details-t)"/><rect x="26.75" y="108.52" width="355.5" height="93.25" rx="15" fill="none" stroke="url(#edge-sentinel-deployment-details-t)" stroke-width="1.5"/><rect x="42.92" y="141.99" width="26.32" height="26.32" rx="8" fill="#DCE0E6"/><rect x="42.92" y="141.99" width="26.32" height="26.32" rx="8" fill="url(#inset-sentinel-deployment-details-t)"/><rect x="43.42" y="142.49" width="25.32" height="25.32" rx="8" fill="none" stroke="#CBD1D9" stroke-opacity=".8"/><text x="56.08" y="158.83" fill="#14161A" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="9.4" font-weight="700" text-anchor="middle">01</text><text x="80.52" y="139.92" fill="#14161A" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.69">Unified-memory mode lets the VLM use</text><text x="80.52" y="160.23" fill="#14161A" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.69">Jetson's shared CPU / GPU memory</text><text x="80.52" y="180.53" fill="#14161A" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.69">pool</text><rect x="397" y="107.77" width="357" height="94.75" rx="15" fill="#EDEFF3" filter="url(#neu-sentinel-deployment-details-t)"/><rect x="397.75" y="108.52" width="355.5" height="93.25" rx="15" fill="none" stroke="url(#edge-sentinel-deployment-details-t)" stroke-width="1.5"/><rect x="413.92" y="141.99" width="26.32" height="26.32" rx="8" fill="#DCE0E6"/><rect x="413.92" y="141.99" width="26.32" height="26.32" rx="8" fill="url(#inset-sentinel-deployment-details-t)"/><rect x="414.42" y="142.49" width="25.32" height="25.32" rx="8" fill="none" stroke="#CBD1D9" stroke-opacity=".8"/><text x="427.08" y="158.83" fill="#14161A" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="9.4" font-weight="700" text-anchor="middle">02</text><text x="451.52" y="139.92" fill="#14161A" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.69">Headless startup launches the VLM</text><text x="451.52" y="160.23" fill="#14161A" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.69">first, then surveillance and</text><text x="451.52" y="180.53" fill="#14161A" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.69">dashboard services</text><rect x="26" y="211.63" width="357" height="94.75" rx="15" fill="#EDEFF3" filter="url(#neu-sentinel-deployment-details-t)"/><rect x="26.75" y="212.38" width="355.5" height="93.25" rx="15" fill="none" stroke="url(#edge-sentinel-deployment-details-t)" stroke-width="1.5"/><rect x="42.92" y="245.84" width="26.32" height="26.32" rx="8" fill="#DCE0E6"/><rect x="42.92" y="245.84" width="26.32" height="26.32" rx="8" fill="url(#inset-sentinel-deployment-details-t)"/><rect x="43.42" y="246.34" width="25.32" height="25.32" rx="8" fill="none" stroke="#CBD1D9" stroke-opacity=".8"/><text x="56.08" y="262.69" fill="#14161A" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="9.4" font-weight="700" text-anchor="middle">03</text><text x="80.52" y="253.93" fill="#14161A" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.69">llama-server, Python inference, and</text><text x="80.52" y="274.23" fill="#14161A" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.69">Flask run as isolated processes</text><rect x="397" y="211.63" width="357" height="94.75" rx="15" fill="#EDEFF3" filter="url(#neu-sentinel-deployment-details-t)"/><rect x="397.75" y="212.38" width="355.5" height="93.25" rx="15" fill="none" stroke="url(#edge-sentinel-deployment-details-t)" stroke-width="1.5"/><rect x="413.92" y="245.84" width="26.32" height="26.32" rx="8" fill="#DCE0E6"/><rect x="413.92" y="245.84" width="26.32" height="26.32" rx="8" fill="url(#inset-sentinel-deployment-details-t)"/><rect x="414.42" y="246.34" width="25.32" height="25.32" rx="8" fill="none" stroke="#CBD1D9" stroke-opacity=".8"/><text x="427.08" y="262.69" fill="#14161A" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="9.4" font-weight="700" text-anchor="middle">04</text><text x="451.52" y="243.77" fill="#14161A" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.69">Frames and state are exchanged</text><text x="451.52" y="264.08" fill="#14161A" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.69">atomically to prevent torn dashboard</text><text x="451.52" y="284.38" fill="#14161A" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.69">reads</text>
