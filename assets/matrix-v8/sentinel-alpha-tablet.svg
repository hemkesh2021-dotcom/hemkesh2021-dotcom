<rect x="26" y="176.72" width="357" height="139.52" rx="19" fill="#EDEFF3" filter="url(#neu-sentinel-alpha-t)"/><rect x="26.75" y="177.47" width="355.5" height="138.02" rx="19" fill="none" stroke="url(#edge-sentinel-alpha-t)" stroke-width="1.5"/><circle cx="47.62" cy="199.47" r="2.82" fill="#3572A5"/><text x="57.96" y="203.41" fill="#3572A5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="9.87" font-weight="700" letter-spacing="1.5">GUARDED VALIDATION</text><text x="44.8" y="234.2" fill="#14161A" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.98" font-weight="600" letter-spacing="-0.2">Jetson Orin Nano</text><text x="44.8" y="259.77" fill="#454B54" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.69">Guarded validation runs of face</text><text x="44.8" y="279.44" fill="#454B54" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.69">recognition, local VLM chat, scene</text><text x="44.8" y="299.1" fill="#454B54" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.69">analysis, and the live dashboard.</text><rect x="397" y="176.72" width="357" height="139.52" rx="19" fill="#EDEFF3" filter="url(#neu-sentinel-alpha-t)"/><rect x="397.75" y="177.47" width="355.5" height="138.02" rx="19" fill="none" stroke="url(#edge-sentinel-alpha-t)" stroke-width="1.5"/><circle cx="418.62" cy="199.47" r="2.82" fill="#3572A5"/><text x="428.96" y="203.41" fill="#3572A5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="9.87" font-weight="700" letter-spacing="1.5">LIMITATIONS</text><text x="415.8" y="234.2" fill="#14161A" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.98" font-weight="600" letter-spacing="-0.2">Validation remains open</text><text x="415.8" y="259.77" fill="#454B54" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.69">Face recognition remains pending</text><text x="415.8" y="279.44" fill="#454B54" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.69">validation. Chat is not admitted for</text><text x="415.8" y="299.1" fill="#454B54" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.69">production use.</text>
<rect x="26" y="330.24" width="728" height="44.98" rx="13" fill="#DCE0E6"/><rect x="26" y="330.24" width="728" height="44.98" rx="13" fill="url(#inset-sentinel-alpha-t)"/><rect x="26.5" y="330.74" width="727" height="43.98" rx="13" fill="none" stroke="#CBD1D9" stroke-opacity=".8"/><rect x="37.84" y="342.08" width="2.82" height="21.29" rx="1.41" fill="#3572A5" opacity=".9"/><text x="54.2" y="355.43" fill="#454B54" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10.81" font-weight="600" letter-spacing="0.4">Beta may release in Q1 2027 (tentative).</text>
