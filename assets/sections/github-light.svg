<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="34" viewBox="0 0 1200 34" role="img" aria-labelledby="t-light">
<title id="t-light">PUBLIC SIGNAL — LIVE DATA / DAILY REFRESH</title>
<defs><linearGradient id="s-light"><stop stop-color="#008AA3" stop-opacity="0"/><stop offset=".5" stop-color="#008AA3" stop-opacity=".3"/><stop offset="1" stop-color="#008AA3" stop-opacity="0"/></linearGradient></defs>
<rect x="1" y="1" width="1198" height="32" rx="16" fill="#FFFFFF" stroke="#DDE3E8"/>
<path d="M18 17H1182" stroke="#DCE6EA"/>
<path d="M18 17H1182" stroke="#008AA3" stroke-dasharray="2 24" opacity=".48"><animate attributeName="stroke-dashoffset" from="0" to="-156" dur="11.8s" repeatCount="indefinite"/></path>
<rect x="-120" y="2" width="120" height="30" rx="15" fill="url(#s-light)"><animate attributeName="x" from="-120" to="1200" dur="9.8s" repeatCount="indefinite"/></rect>
<circle r="3.5" fill="#008AA3"><animateMotion path="M176 17H1030" dur="7.8s" repeatCount="indefinite"/><animate attributeName="opacity" values=".3;1;.3" dur="1.8s" repeatCount="indefinite"/></circle>
<text x="24" y="21" fill="#16222B" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" letter-spacing=".9">PUBLIC SIGNAL</text>
<text x="1158" y="21" text-anchor="end" fill="#59636E" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" letter-spacing=".8">LIVE DATA / DAILY REFRESH</text>
<circle cx="1173" cy="17" r="3.5" fill="#008AA3"><animate attributeName="r" values="2.6;4.7;2.6" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".45;1;.45" dur="2s" repeatCount="indefinite"/></circle>
</svg>
