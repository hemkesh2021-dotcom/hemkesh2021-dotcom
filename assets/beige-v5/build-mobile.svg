<svg xmlns="http://www.w3.org/2000/svg" width="680" height="870" viewBox="0 0 680 870" role="img" aria-labelledby="title-build-m-v5">
<title id="title-build-m-v5">What I build</title>
<defs>
  <linearGradient id="scan-build-m-v5" x1="0" x2="1"><stop stop-color="#008EA3" stop-opacity="0"/><stop offset=".5" stop-color="#008EA3" stop-opacity=".16"/><stop offset="1" stop-color="#008EA3" stop-opacity="0"/></linearGradient>
  <filter id="shadow-build-m-v5" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#594E40" flood-opacity=".18"/></filter>
  <filter id="soft-build-m-v5" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#594E40" flood-opacity=".13"/></filter>
</defs>
<rect width="680" height="870" rx="28" fill="#E8DFD0"/>
<text x="28" y="58" fill="#C86432" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18">01</text><text x="69" y="58" fill="#1D1B18" font-family="Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="32" font-weight="760">What I build</text><rect x="24" y="88" width="632" height="222" rx="22" fill="#F4EEE4" stroke="#C9BBA7" filter="url(#soft-build-m-v5)"/><text x="50" y="128" fill="#008EA3" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17">$ genai</text><text x="50" y="175" fill="#1D1B18" font-family="Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="25" font-weight="760">Generative AI systems</text><text x="50" y="219" fill="#6E675E" font-family="Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17">Agent workflows, hybrid retrieval,</text><text x="50" y="248" fill="#6E675E" font-family="Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17">grounded generation, evaluation,</text><text x="50" y="277" fill="#6E675E" font-family="Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17">and human approval paths.</text><rect x="24" y="334" width="632" height="222" rx="22" fill="#F4EEE4" stroke="#C9BBA7" filter="url(#soft-build-m-v5)"/><text x="50" y="374" fill="#008EA3" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17">$ edge</text><text x="50" y="421" fill="#1D1B18" font-family="Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="25" font-weight="760">Edge intelligence</text><text x="50" y="465" fill="#6E675E" font-family="Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17">TensorRT computer vision, local</text><text x="50" y="494" fill="#6E675E" font-family="Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17">multimodal models, constrained-memory</text><text x="50" y="523" fill="#6E675E" font-family="Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17">deployment, and real-time inference.</text><rect x="24" y="580" width="632" height="222" rx="22" fill="#F4EEE4" stroke="#C9BBA7" filter="url(#soft-build-m-v5)"/><text x="50" y="620" fill="#008EA3" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17">$ systems</text><text x="50" y="667" fill="#1D1B18" font-family="Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="25" font-weight="760">Production-oriented software</text><text x="50" y="711" fill="#6E675E" font-family="Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17">Java and Python services, full-stack</text><text x="50" y="740" fill="#6E675E" font-family="Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17">interfaces, PostgreSQL, containers,</text><text x="50" y="769" fill="#6E675E" font-family="Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17">security, and observability.</text>
<rect x="-163" y="10" width="163" height="850" rx="22" fill="url(#scan-build-m-v5)"><animate attributeName="x" from="-163" to="680" dur="10.5s" repeatCount="indefinite"/></rect>
<path d="M24 853H656" stroke="#C9BBA7"/>
<path d="M24 853H656" stroke="#008EA3" stroke-width="1.4" stroke-dasharray="4 24" opacity=".58"><animate attributeName="stroke-dashoffset" from="0" to="-224" dur="11s" repeatCount="indefinite"/></path>
<circle r="3.8" fill="#C86432"><animateMotion path="M28 853H652" dur="8.2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".25;1;.25" dur="1.7s" repeatCount="indefinite"/></circle>
</svg>