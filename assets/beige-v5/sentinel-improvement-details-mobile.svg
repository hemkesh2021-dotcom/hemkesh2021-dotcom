<svg xmlns="http://www.w3.org/2000/svg" width="680" height="752" viewBox="0 0 680 752" role="img" aria-labelledby="title-detail-sentinel-improvement-m-v5">
<title id="title-detail-sentinel-improvement-m-v5">SENTINEL active improvement details</title>
<defs>
  <linearGradient id="scan-detail-sentinel-improvement-m-v5" x1="0" x2="1"><stop stop-color="#008EA3" stop-opacity="0"/><stop offset=".5" stop-color="#008EA3" stop-opacity=".16"/><stop offset="1" stop-color="#008EA3" stop-opacity="0"/></linearGradient>
  <filter id="shadow-detail-sentinel-improvement-m-v5" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#594E40" flood-opacity=".18"/></filter>
  <filter id="soft-detail-sentinel-improvement-m-v5" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#594E40" flood-opacity=".13"/></filter>
</defs>
<rect width="680" height="752" rx="28" fill="#E8DFD0"/>
<rect x="28" y="24" width="624" height="128" rx="20" fill="#F4EEE4" stroke="#C9BBA7" filter="url(#soft-detail-sentinel-improvement-m-v5)"/>
<text x="52" y="55" fill="#C86432" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="800" letter-spacing="1.25">STAGE 03 // ITERATION QUEUE</text>
<text x="52" y="89" fill="#1D1B18" font-family="Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" font-weight="720">The prototype is complete; these production</text><text x="52" y="116" fill="#1D1B18" font-family="Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" font-weight="720">improvements remain active.</text><rect x="28" y="170" width="624" height="82" rx="16" fill="#FBF7EF" stroke="#C9BBA7"/>
<circle cx="50" cy="197" r="4.5" fill="#C86432"><animate attributeName="opacity" values=".35;1;.35" dur="2.10s" repeatCount="indefinite"/></circle>
<text x="67" y="202" fill="#1D1B18" font-family="Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16" font-weight="700">Enforce the project memory cap</text><text x="67" y="226" fill="#6E675E" font-family="Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16" font-weight="500">and reduce peak runtime usage</text><rect x="28" y="265" width="624" height="82" rx="16" fill="#FBF7EF" stroke="#C9BBA7"/>
<circle cx="50" cy="292" r="4.5" fill="#C86432"><animate attributeName="opacity" values=".35;1;.35" dur="2.23s" repeatCount="indefinite"/></circle>
<text x="67" y="297" fill="#1D1B18" font-family="Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16" font-weight="700">Improve camera reconnection, reliability,</text><text x="67" y="321" fill="#6E675E" font-family="Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16" font-weight="500">and long-running observability</text><rect x="28" y="360" width="624" height="82" rx="16" fill="#FBF7EF" stroke="#C9BBA7"/>
<circle cx="50" cy="387" r="4.5" fill="#C86432"><animate attributeName="opacity" values=".35;1;.35" dur="2.36s" repeatCount="indefinite"/></circle>
<text x="67" y="392" fill="#1D1B18" font-family="Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16" font-weight="700">Harden authentication, transport security,</text><text x="67" y="416" fill="#6E675E" font-family="Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16" font-weight="500">secrets handling, and deployment defaults</text><rect x="28" y="455" width="624" height="82" rx="16" fill="#FBF7EF" stroke="#C9BBA7"/>
<circle cx="50" cy="482" r="4.5" fill="#C86432"><animate attributeName="opacity" values=".35;1;.35" dur="2.49s" repeatCount="indefinite"/></circle>
<text x="67" y="487" fill="#1D1B18" font-family="Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16" font-weight="700">Expand PTZ patrol and tracking</text><text x="67" y="511" fill="#6E675E" font-family="Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16" font-weight="500">with persistent home-position behavior</text><rect x="28" y="550" width="624" height="82" rx="16" fill="#FBF7EF" stroke="#C9BBA7"/>
<circle cx="50" cy="577" r="4.5" fill="#C86432"><animate attributeName="opacity" values=".35;1;.35" dur="2.62s" repeatCount="indefinite"/></circle>
<text x="67" y="582" fill="#1D1B18" font-family="Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16" font-weight="700">Upgrade the responsive web experience</text><text x="67" y="606" fill="#6E675E" font-family="Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16" font-weight="500">and prepare Android / iOS client support</text><rect x="28" y="650" width="624" height="62" rx="18" fill="#DED3C2" stroke="#C9BBA7"/>
<text x="50" y="680" fill="#1D1B18" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" font-weight="760">STATUS · PROTOTYPE COMPLETE // IMPROVEMENT PROCESS ACTIVE</text>
<rect x="-163" y="10" width="163" height="732" rx="22" fill="url(#scan-detail-sentinel-improvement-m-v5)"><animate attributeName="x" from="-163" to="680" dur="10.5s" repeatCount="indefinite"/></rect>
<path d="M24 735H656" stroke="#C9BBA7"/>
<path d="M24 735H656" stroke="#C86432" stroke-width="1.4" stroke-dasharray="4 24" opacity=".58"><animate attributeName="stroke-dashoffset" from="0" to="-224" dur="11s" repeatCount="indefinite"/></path>
<circle r="3.8" fill="#C86432"><animateMotion path="M28 735H652" dur="8.2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".25;1;.25" dur="1.7s" repeatCount="indefinite"/></circle>
</svg>