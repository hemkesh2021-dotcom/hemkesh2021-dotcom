<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title-detail-sentinel-improvement-d-v5">
<title id="title-detail-sentinel-improvement-d-v5">SENTINEL active improvement details</title>
<defs>
  <linearGradient id="scan-detail-sentinel-improvement-d-v5" x1="0" x2="1"><stop stop-color="#008EA3" stop-opacity="0"/><stop offset=".5" stop-color="#008EA3" stop-opacity=".16"/><stop offset="1" stop-color="#008EA3" stop-opacity="0"/></linearGradient>
  <filter id="shadow-detail-sentinel-improvement-d-v5" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#594E40" flood-opacity=".18"/></filter>
  <filter id="soft-detail-sentinel-improvement-d-v5" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#594E40" flood-opacity=".13"/></filter>
</defs>
<rect width="1200" height="540" rx="28" fill="#E8DFD0"/>
<rect x="30" y="24" width="1140" height="104" rx="20" fill="#F4EEE4" stroke="#C9BBA7" filter="url(#soft-detail-sentinel-improvement-d-v5)"/>
<text x="54" y="55" fill="#C86432" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="800" letter-spacing="1.25">STAGE 03 // ITERATION QUEUE</text>
<text x="54" y="89" fill="#1D1B18" font-family="Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="720">The prototype is complete; these production improvements remain active.</text><rect x="30" y="146" width="556" height="82" rx="16" fill="#FBF7EF" stroke="#C9BBA7"/>
<circle cx="52" cy="173" r="4.5" fill="#C86432"><animate attributeName="opacity" values=".35;1;.35" dur="2.10s" repeatCount="indefinite"/></circle>
<text x="69" y="178" fill="#1D1B18" font-family="Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" font-weight="700">Enforce the project memory cap</text><text x="69" y="202" fill="#6E675E" font-family="Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" font-weight="500">and reduce peak runtime usage</text><rect x="614" y="146" width="556" height="82" rx="16" fill="#FBF7EF" stroke="#C9BBA7"/>
<circle cx="636" cy="173" r="4.5" fill="#C86432"><animate attributeName="opacity" values=".35;1;.35" dur="2.23s" repeatCount="indefinite"/></circle>
<text x="653" y="178" fill="#1D1B18" font-family="Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" font-weight="700">Improve camera reconnection, reliability,</text><text x="653" y="202" fill="#6E675E" font-family="Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" font-weight="500">and long-running observability</text><rect x="30" y="242" width="556" height="82" rx="16" fill="#FBF7EF" stroke="#C9BBA7"/>
<circle cx="52" cy="269" r="4.5" fill="#C86432"><animate attributeName="opacity" values=".35;1;.35" dur="2.36s" repeatCount="indefinite"/></circle>
<text x="69" y="274" fill="#1D1B18" font-family="Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" font-weight="700">Harden authentication, transport security,</text><text x="69" y="298" fill="#6E675E" font-family="Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" font-weight="500">secrets handling, and deployment defaults</text><rect x="614" y="242" width="556" height="82" rx="16" fill="#FBF7EF" stroke="#C9BBA7"/>
<circle cx="636" cy="269" r="4.5" fill="#C86432"><animate attributeName="opacity" values=".35;1;.35" dur="2.49s" repeatCount="indefinite"/></circle>
<text x="653" y="274" fill="#1D1B18" font-family="Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" font-weight="700">Expand PTZ patrol and tracking</text><text x="653" y="298" fill="#6E675E" font-family="Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" font-weight="500">with persistent home-position behavior</text><rect x="30" y="338" width="556" height="82" rx="16" fill="#FBF7EF" stroke="#C9BBA7"/>
<circle cx="52" cy="365" r="4.5" fill="#C86432"><animate attributeName="opacity" values=".35;1;.35" dur="2.62s" repeatCount="indefinite"/></circle>
<text x="69" y="370" fill="#1D1B18" font-family="Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" font-weight="700">Upgrade the responsive web experience</text><text x="69" y="394" fill="#6E675E" font-family="Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" font-weight="500">and prepare Android / iOS client support</text><rect x="30" y="439" width="1140" height="62" rx="18" fill="#DED3C2" stroke="#C9BBA7"/>
<text x="52" y="469" fill="#1D1B18" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="760">STATUS · PROTOTYPE COMPLETE // IMPROVEMENT PROCESS ACTIVE</text>
<rect x="-288" y="10" width="288" height="520" rx="22" fill="url(#scan-detail-sentinel-improvement-d-v5)"><animate attributeName="x" from="-288" to="1200" dur="10.5s" repeatCount="indefinite"/></rect>
<path d="M24 523H1176" stroke="#C9BBA7"/>
<path d="M24 523H1176" stroke="#C86432" stroke-width="1.4" stroke-dasharray="4 24" opacity=".58"><animate attributeName="stroke-dashoffset" from="0" to="-224" dur="11s" repeatCount="indefinite"/></path>
<circle r="3.8" fill="#C86432"><animateMotion path="M28 523H1172" dur="8.2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".25;1;.25" dur="1.7s" repeatCount="indefinite"/></circle>
</svg>