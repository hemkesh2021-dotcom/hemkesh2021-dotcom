<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="370" viewBox="0 0 1200 370" role="img" aria-labelledby="title-build-d-v5">
<title id="title-build-d-v5">What I build</title>
<defs>
  <linearGradient id="scan-build-d-v5" x1="0" x2="1"><stop stop-color="#008EA3" stop-opacity="0"/><stop offset=".5" stop-color="#008EA3" stop-opacity=".16"/><stop offset="1" stop-color="#008EA3" stop-opacity="0"/></linearGradient>
  <filter id="shadow-build-d-v5" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#594E40" flood-opacity=".18"/></filter>
  <filter id="soft-build-d-v5" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#594E40" flood-opacity=".13"/></filter>
</defs>
<rect width="1200" height="370" rx="28" fill="#E8DFD0"/>
<text x="34" y="62" fill="#C86432" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18">01</text><text x="76" y="62" fill="#1D1B18" font-family="Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="32" font-weight="760">What I build</text><rect x="28" y="94" width="364" height="235" rx="22" fill="#F4EEE4" stroke="#C9BBA7" filter="url(#soft-build-d-v5)"/><text x="53" y="135" fill="#008EA3" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16">$ genai</text><text x="53" y="181" fill="#1D1B18" font-family="Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="23" font-weight="760">Generative AI systems</text><text x="53" y="225" fill="#6E675E" font-family="Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16">Agent workflows, hybrid retrieval,</text><text x="53" y="254" fill="#6E675E" font-family="Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16">grounded generation, evaluation,</text><text x="53" y="283" fill="#6E675E" font-family="Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16">and human approval paths.</text><rect x="418" y="94" width="364" height="235" rx="22" fill="#F4EEE4" stroke="#C9BBA7" filter="url(#soft-build-d-v5)"/><text x="443" y="135" fill="#008EA3" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16">$ edge</text><text x="443" y="181" fill="#1D1B18" font-family="Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="23" font-weight="760">Edge intelligence</text><text x="443" y="225" fill="#6E675E" font-family="Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16">TensorRT computer vision, local</text><text x="443" y="254" fill="#6E675E" font-family="Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16">multimodal models, constrained-memory</text><text x="443" y="283" fill="#6E675E" font-family="Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16">deployment, and real-time inference.</text><rect x="808" y="94" width="364" height="235" rx="22" fill="#F4EEE4" stroke="#C9BBA7" filter="url(#soft-build-d-v5)"/><text x="833" y="135" fill="#008EA3" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16">$ systems</text><text x="833" y="181" fill="#1D1B18" font-family="Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="23" font-weight="760">Production-oriented software</text><text x="833" y="225" fill="#6E675E" font-family="Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16">Java and Python services, full-stack</text><text x="833" y="254" fill="#6E675E" font-family="Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16">interfaces, PostgreSQL, containers,</text><text x="833" y="283" fill="#6E675E" font-family="Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16">security, and observability.</text>
<rect x="-288" y="10" width="288" height="350" rx="22" fill="url(#scan-build-d-v5)"><animate attributeName="x" from="-288" to="1200" dur="10.5s" repeatCount="indefinite"/></rect>
<path d="M24 353H1176" stroke="#C9BBA7"/>
<path d="M24 353H1176" stroke="#008EA3" stroke-width="1.4" stroke-dasharray="4 24" opacity=".58"><animate attributeName="stroke-dashoffset" from="0" to="-224" dur="11s" repeatCount="indefinite"/></path>
<circle r="3.8" fill="#C86432"><animateMotion path="M28 353H1172" dur="8.2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".25;1;.25" dur="1.7s" repeatCount="indefinite"/></circle>
</svg>